method: autoscilab  # LLM-AutoSciLab の部品 + SciGym 用アダプタ
split: small
n_instances: 10  # id 順に等間隔の 10 件（3 run で同じ件）
large_model: openai/gpt-6-luna
small_model: openai/gpt-6-luna
budget: 20  # 正解モデルへの問い合わせ回数
experiments_per_iter: 4
acquisition: none  # アブレーション: 食い違いスコアを 0 にし、select の多様性項だけで実験を選ぶ
hypothesis_format: antimony  # 仮説 = Antimony の反応ブロック（速度則は自由）
ensemble_k: 5
ensemble_k_max: 20
ensemble_stability_threshold: 0.1
ensemble_temperature: 1.0
ensemble_max_tokens: 4096
large_max_tokens: 8192
n_candidates: 2000
diversity_weight: 0.3
confidence_threshold: 0.9
min_r2: 0.5  # 公式 learner.py の R² の門
n_bootstrap: 3
seed: 0  # 候補点のサンプリング、フィットの再始動、ブートストラップに使う乱数
concentration_bounds_factor: [0.2, 5.0]  # 実験で設定してよい初期濃度の範囲（既定値の倍率）
sim_timeout: 15  # 候補の試走 1 バッチの時間切れ（秒）= sim_timeout + sim_timeout_per_job × 件数
sim_timeout_per_job: 0.02
workers: 10
stall_timeout: 900  # 出力が止まってからこの秒数で試行を打ち切る。ループはフィットごとに出力する
